<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Document_files/style_NkVZ.css">
</head>
<body>
    <section>
        <div class="contenedor">
            <form action="">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" placeholder="Nombre">
                </div>
                <div>
                    <label for="apellido">Apellido</label>
                    <input type="text" placeholder="Apellido">
                </div>
                <div>
                    <label for="edad">Edad</label>
                    <input type="number" placeholder="Edad">
                </div>
                <div>
                    <label for="correo">Correo</label>
                    <input type="email" placeholder="Correo">
                </div>
                <div>
                    <label for="contraseña">Contraseña</label>
                    <input type="password" placeholder="Contraseña" value="">
                </div>
                <div>
                    <label for="telefono">Telefono</label>
                    <input type="tel" placeholder="Telefono" name="telefono" id="telefono">
                </div>  
                <div>
                    <label for="url">URL</label>
                    <input type="url" placeholder="URL" name="url" id="url">
                </div>
                <div>
                    <label for="terminos">Acepto los términos y condiciones</label>
                    <input type="checkbox" name="terminos" id="terminos">
                </div>
                <div>
                    <label for="genero">Género</label>
                    <input type="radio" name="genero" id="masculino" checked="checked">
                    <label for="masculino">Masculino</label>
                    <input type="radio" name="genero" id="femenino">
                    <label for="femenino">Femenino</label>
                    <input type="radio" name="genero" id="otro">
                    <label for="otro">Otro</label>
                </div>
                <div>
                    <label for="fecha">Fecha</label>
                    <input type="datetime-local" name="fecha" id="fecha">
                </div>
                <div>
                    <label for="hora">Hora</label>
                    <input type="time" name="hora" id="hora">
                </div>
                <div>
                    <label for="color">Color</label>
                    <input type="color" name="color" id="color" value="#000000">
                </div>
                <div>
                    <label for="rango">Rango</label>
                    <input type="range" name="rango" id="rango" value="50">
                </div>
                <div>
                    <label for="archivo">Archivo</label>
                    <input type="file" name="archivo" id="archivo">
                </div>
                <div>
                    <input type="reset" name="reset" id="reset">
                </div>

                <input type="submit" value="Enviar formulario">

            </form>

        </div>
    </section>

</body><style type="text/css"></style></html>
